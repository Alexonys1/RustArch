[package]
name = "rustarch"
version = "0.1.0"
edition = "2024"

[profile.dev]
opt-level = 0
codegen-units = 2

[profile.release]
opt-level = 3
codegen-units = 1 # Бустит скорость больше, чем на 0.5с!!
#lto = true
#debug = true
#panic = "abort"
#strip = true

[dependencies]
owo-colors = "4"
thiserror = "2"

[features]
default = ["statistics"]
statistics = []
ignore_compressed_extensions = []

[profile.samply]
inherits = "release"
debug = true

[target.'cfg(windows)'.dependencies]
enable-ansi-support = "0"
